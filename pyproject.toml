[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "computer-use-subq"
version = "0.1.0"
description = "Universal Autonomous Desktop Voice Agent using SubQ Snap Reflex and Gemini Multimodal Computer Use"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "yapwrap[all]>=0.0.1a1",
    "pyautogui>=0.9.54",
    "pytweening>=1.2.0",
    "pillow>=10.0.0",
    "mss>=9.0.0",
    "agno>=3.1.5",
    "google-genai>=2.31.0",
    "pydirectinput>=1.0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["reflex_agent"]
